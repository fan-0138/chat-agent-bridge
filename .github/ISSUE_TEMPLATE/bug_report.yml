name: "🐛 Bug 报告"
description: 跑不起来、报错、行为不对
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        先看一眼 [README](https://github.com/fan-0138/chat-agent-bridge#readme) 和 [已知边界](https://github.com/fan-0138/chat-agent-bridge#已知边界)，
        很多「跑不通」是环境问题（NapCat 在 macOS 装不了、没起 OneBot、没建 persona.md）。

        **⚠️ 贴日志前先删掉：账号、token、cookie、聊天内容。**

  - type: input
    id: env
    attributes:
      label: 环境
      description: macOS 版本 + 芯片型号 + Node 版本
      placeholder: "macOS 15.7.8 / Apple Silicon M1 / Node 22.18"
    validations:
      required: true

  - type: dropdown
    id: channel
    attributes:
      label: 哪个通道
      options:
        - QQ（OneBot）
        - 微信（iLink）
        - 抖音（网页版）
        - 启动/配置阶段就挂了
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: 模型后端
      options:
        - dsh（DeepSeek Harness）
        - openai（OpenAI 兼容接口）
        - 不知道 / 还没到这一步
    validations:
      required: true

  - type: input
    id: onebot
    attributes:
      label: 用的哪个 OneBot 端
      description: SnowLuma / NapCat / LLOneBot / 其他（QQ 通道必填）
      placeholder: "Docker 里的 SnowLuma"

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从干净状态开始，你按了什么、看到了什么
      placeholder: |
        1. npm run start:qq
        2. 手机 QQ 发「在吗」
        3. 控制台出现 xxx 报错
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 报错 / 日志
      description: 控制台输出或 logs/qq-bridge.log 的片段（记得脱敏）
      render: shell
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已经读过 DISCLAIMER，知道这是非官方接口、有封号风险
          required: true
        - label: 日志和截图里没有账号、token、cookie、聊天内容
          required: true