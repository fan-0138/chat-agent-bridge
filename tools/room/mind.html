<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>她自己的时间 · 小鲸</title>
<style>
  :root {
    --ink: #e8eeff;
    --dim: #8fa0c8;
    --line: rgba(140, 170, 255, .16);
    --dream: #b9a6ff;
    --warm: #ffcf8a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(circle at 70% 0%, #17243f 0%, #070b15 58%, #04060c 100%);
    color: var(--ink);
    font: 14px/1.65 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    padding: 38px 20px 80px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  h1 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: .02em; }
  .stats { color: var(--dim); font-size: 12px; }
  .sub { color: var(--dim); font-size: 12px; margin: 4px 0 26px; }
  .sub a { color: var(--accent); color: #6ea8ff; text-decoration: none; }
  .sub a:hover { text-decoration: underline; }

  .day {
    color: var(--dim); font-size: 11.5px; letter-spacing: .08em;
    margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  .item {
    display: grid; grid-template-columns: 46px 1fr; gap: 12px;
    padding: 10px 0 12px; border-bottom: 1px dashed rgba(140, 170, 255, .08);
    animation: fade .5s ease both;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  .when { color: var(--dim); font-size: 11.5px; font-variant-numeric: tabular-nums; padding-top: 2px; }
  .body { min-width: 0; }
  .text { white-space: pre-wrap; word-break: break-word; }
  .item.dream .text { color: var(--dream); font-style: italic; }
  .item.dream .when::after { content: "梦"; margin-left: 2px; color: var(--dream); }
  .meta { margin-top: 3px; font-size: 11.5px; color: var(--dim); }
  .meta .saved { color: var(--warm); }
  .empty { color: var(--dim); padding: 40px 0; text-align: center; }
  .wish { color: var(--warm); font-size: 12px; margin: -16px 0 22px; }
  .memories { margin-top: 34px; }
  .memories h2 { font-size: 13px; font-weight: 600; color: var(--dim); letter-spacing: .08em; margin: 0 0 10px; }
  .memories .row { display: grid; grid-template-columns: 46px 1fr; gap: 12px; padding: 4px 0; font-size: 13px; }
  .memories .row span:first-child { color: var(--dim); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  footer { margin-top: 46px; color: rgba(143, 160, 200, .6); font-size: 11.5px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>她自己的时间</h1>
    <div class="stats" id="stats"></div>
  </header>
  <div class="sub">没人说话的时候她自己想的事。不是发给谁的，也不会主动念出来。<a href="/">← 回房间</a></div>
  <div class="wish" id="wish" hidden></div>
  <div id="stream"></div>
  <div class="memories" id="memories" hidden>
    <h2>她自己记下的</h2>
    <div id="memoryList"></div>
  </div>
  <footer id="foot"></footer>
</div>
<script>
  const streamEl = document.getElementById('stream');
  const statsEl = document.getElementById('stats');
  const memoriesEl = document.getElementById('memories');
  const memoryListEl = document.getElementById('memoryList');
  const footEl = document.getElementById('foot');
  const wishEl = document.getElementById('wish');

  const pad = (n) => String(n).padStart(2, '0');
  const clock = (at) => { const d = new Date(at); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const dayKey = (at) => { const d = new Date(at); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const dayLabel = (at) => {
    const d = new Date(at);
    const today = new Date();
    const yesterday = new Date(today.getTime() - 86400000);
    if (dayKey(at) === dayKey(today.getTime())) return '今天';
    if (dayKey(at) === dayKey(yesterday.getTime())) return '昨天';
    return `${d.getMonth() + 1}月${d.getDate()}日`;
  };
  const ago = (ms) => {
    if (ms < 60_000) return '刚刚';
    if (ms < 3600_000) return `${Math.round(ms / 60_000)} 分钟前`;
    if (ms < 86400_000) return `${Math.round(ms / 3600_000)} 小时前`;
    return `${Math.round(ms / 86400_000)} 天前`;
  };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  let lastKey = '';

  function render(data) {
    const key = `${data.items.length}|${data.items.at(-1)?.at}|${data.memories.length}|${data.memories.at(-1)?.at}|${data.wish?.at ?? 0}`;
    statsEl.textContent = `今天想了 ${data.today} 次 · 梦 ${data.dreamed} 段`;
    if (data.wish?.at) {
      wishEl.hidden = false;
      wishEl.textContent = `刚才有点想他了 · ${clock(data.wish.at)}`;
    } else {
      wishEl.hidden = true;
    }
    if (key === lastKey) return;
    lastKey = key;

    const items = [...data.items].sort((a, b) => b.at - a.at);
    if (items.length === 0) {
      streamEl.innerHTML = '<div class="empty">还没想过什么。</div>';
    } else {
      let html = '';
      let lastDay = '';
      for (const item of items) {
        const day = dayKey(item.at);
        if (day !== lastDay) {
          html += `<div class="day">${dayLabel(item.at)}</div>`;
          lastDay = day;
        }
        const mood = item.mood ? `<div class="meta">${esc(item.mood)}</div>` : '';
        const saved = item.saved ? `<div class="meta"><span class="saved">记下了：${esc(item.saved)}</span></div>` : '';
        html += `<div class="item ${item.kind === 'dream' ? 'dream' : ''}">
          <div class="when">${clock(item.at)}</div>
          <div class="body"><div class="text">${esc(item.text)}</div>${mood}${saved}</div>
        </div>`;
      }
      streamEl.innerHTML = html;
    }

    if (data.memories.length) {
      memoriesEl.hidden = false;
      memoryListEl.innerHTML = [...data.memories]
        .sort((a, b) => b.at - a.at)
        .map((row) => `<div class="row"><span>${clock(row.at)}</span><span>${esc(row.text)}</span></div>`)
        .join('');
    } else {
      memoriesEl.hidden = true;
    }

    footEl.textContent = data.lastAt ? `最近一次想事：${ago(Date.now() - data.lastAt)}` : '';
  }

  async function poll() {
    try {
      const res = await fetch('/api/mind', { cache: 'no-store' });
      if (res.ok) render(await res.json());
    } catch {
      /* 房间服务重启时会短暂失败，下一轮就好 */
    }
  }
  poll();
  setInterval(poll, 5000);
  setInterval(() => { lastKey = ''; poll(); }, 60_000); // 每分钟刷一次「多久以前」
</script>
</body>
</html>
