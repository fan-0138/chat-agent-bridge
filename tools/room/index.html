<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>小鲸的房间</title>
<style>
  :root {
    --ink: #e8eeff;
    --dim: #8fa0c8;
    --accent: #6ea8ff;
    --warm: #ffcf8a;
    --panel: rgba(12, 18, 34, 0.7);
    --line: rgba(140, 170, 255, 0.18);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at 70% 10%, #16233d 0%, #070b15 62%, #05070d 100%);
    color: var(--ink);
    font: 14px/1.5 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  /* ── 整个画面 ── */
  .stage {
    position: relative;
    width: min(96vw, calc(96vh * 16 / 9));
    aspect-ratio: 16 / 9;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(120, 150, 220, 0.14);
    background: #0b1220;
  }
  .room {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; z-index: 1;
    transition: filter 2.2s ease;
  }
  .vignette {
    position: absolute; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(ellipse at 50% 46%, rgba(4, 6, 12, 0) 52%, rgba(4, 6, 12, .34) 100%);
    transition: background 2.2s ease;
  }
  /* 她睡着的时候，房间的灯也暗下来 */
  .asleep .room { filter: brightness(.74) saturate(.86); }
  .asleep .vignette { background: radial-gradient(ellipse at 24% 62%, rgba(4, 6, 12, 0) 26%, rgba(4, 6, 12, .5) 100%); }

  /* ── 小屋版（dsh-in-home 的娃娃屋，?house=1）── */
  .stage.house { width: min(96vw, calc(96vh * 1376 / 768)); aspect-ratio: 1376 / 768; }
  .stage.house .vignette { background: radial-gradient(ellipse at 50% 46%, rgba(6, 8, 14, 0) 62%, rgba(6, 8, 14, .26) 100%); }
  .stage.house.asleep .room { filter: brightness(.86) saturate(.95); }
  .stage.house.asleep .vignette { background: radial-gradient(ellipse at 34% 60%, rgba(6, 8, 14, 0) 36%, rgba(6, 8, 14, .4) 100%); }
  /* ── 家具热区：点一下她会过去做点什么 ── */
  #hotspots { position: absolute; inset: 0; z-index: 7; }
  .hotspot {
    position: absolute; border: 0; padding: 0; background: transparent;
    border-radius: 10px; cursor: pointer;
    transition: background .15s, box-shadow .15s;
  }
  .hotspot:hover, .hotspot:focus-visible {
    background: rgba(255, 255, 255, .07);
    box-shadow: inset 0 0 0 1.5px rgba(140, 190, 255, .5), 0 0 24px rgba(110, 168, 255, .15);
    outline: none;
  }
  .hotspot::after {
    content: attr(data-label);
    position: absolute; left: 50%; top: -24px; transform: translateX(-50%);
    font-size: 11px; color: #dbe8ff; background: rgba(12, 18, 34, .88);
    border: 1px solid rgba(140, 170, 255, .3); border-radius: 999px;
    padding: 2px 9px; opacity: 0; transition: opacity .15s; pointer-events: none;
    white-space: nowrap;
  }
  .hotspot:hover::after { opacity: 1; }
  #hint {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
    z-index: 9; font-size: 12px; color: rgba(220, 232, 255, .85);
    background: rgba(10, 15, 26, .62); border: 1px solid rgba(140, 170, 255, .25);
    border-radius: 999px; padding: 6px 14px; pointer-events: none;
    transition: opacity 1s ease;
  }
  /* 睡法切换：床边特写 / 房里远景（远处路过看一眼） */
  #sleepMode {
    position: absolute; right: 12px; bottom: 12px; z-index: 9;
    font: inherit; font-size: 11.5px; color: rgba(220, 232, 255, .82);
    background: rgba(10, 15, 26, .62); border: 1px solid rgba(140, 170, 255, .25);
    border-radius: 999px; padding: 5px 12px; cursor: pointer;
    transition: background .15s, color .15s;
  }
  #sleepMode:hover { background: rgba(30, 44, 74, .85); color: #eaf2ff; }

  /* 关灯：把房间压暗一点（她自己会去按开关） */
  .stage.lights-off .room { filter: brightness(.62) saturate(.85); }
  .stage.house.lights-off .room { filter: brightness(.8) saturate(.92); }

  .house-credit {
    position: absolute; right: 10px; bottom: 8px; z-index: 9;
    font-size: 10px; letter-spacing: .5px; color: rgba(210, 225, 255, .42);
    pointer-events: none;
  }

  /* ── 她 ── */
  #her {
    position: absolute;
    height: 62%;               /* 和 walk.mjs 的 SPRITE_BASE_HEIGHT 一致 */
    left: 50%; bottom: 12%;
    transform-origin: 50% 100%;
    transform: translateX(-50%) scale(.7);
    filter: drop-shadow(0 14px 18px rgba(0, 0, 0, 0.55));
    z-index: 4;
    will-change: left, bottom, transform;
  }
  #her { display: grid; }
  #her video {
    grid-area: 1 / 1;
    height: 100%; width: auto; display: block;
    opacity: 0;
    visibility: hidden;
  }
  #her video.is-on { opacity: 1; visibility: visible; }

  /* 她脚下那摊影子：位置/大小每帧跟着脚走（在 index 脚本里算） */
  #herShadow {
    position: absolute;
    z-index: 3;
    left: 50%; bottom: 10%;
    width: 7%; height: 2.2%;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(0, 0, 0, .58), rgba(0, 0, 0, .28) 55%, rgba(0, 0, 0, 0) 72%);
    transition: opacity 1.2s ease;
  }

  /* 睡觉的 zzz（sprite 里也带，这里补一层轻的） */
  .zzz { position: absolute; left: 66%; top: 56%; font-size: 13px; color: #b9cdff; opacity: 0; transition: opacity .8s; }
  #her[data-scene="sleep"] .zzz { opacity: .75; animation: floatz 3.2s ease-in-out infinite; }
  @keyframes floatz { 0% { transform: translate(0, 0); opacity: .2; } 50% { transform: translate(6px, -12px); opacity: .9; } 100% { transform: translate(12px, -24px); opacity: 0; } }

  /* ── 睡觉特写 ──
     三层都是同一个 Blender 机位（camSleep）渲的，所以按百分比叠就是严丝合缝：
     空床背景 ← 被子（盖上来、呼吸、掀开）← 她的睡脸（从 sleep 片段里抠的）。 */
  #sleepScene {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    opacity: 0; visibility: hidden;
    transition: opacity 1.2s ease, visibility 0s linear 1.2s;
  }
  #sleepScene.is-on { opacity: 1; visibility: visible; transition: opacity 1.2s ease; }
  /* 画面裁近一点：不然床太大、她像坐在别人床上 */
  .sleep-zoom { position: absolute; inset: 0; transform: scale(1.10); transform-origin: 37% 47%; }
  #sleepBg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #sleepDuvet { position: absolute; left: 0; top: 9%; width: 100%; height: 100%; display: block; }
  /* 上半身：坐在床头，腰以下交给被子挡着（只有一颗头会像被切开，别再来一次） */
  #sleepBody {
    position: absolute; left: 41%; bottom: 51.8%; width: 19.5%; height: auto;
    transform: translateX(-50%);
    opacity: 0; transition: opacity .9s ease .35s;
    filter: drop-shadow(0 12px 18px rgba(6, 10, 22, .45));
  }
  #sleepScene.is-on #sleepBody {
    opacity: 1;
    animation: body-breathe 5.6s ease-in-out 1.4s infinite;
  }
  @keyframes body-breathe {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(-.45%); }
  }
  /* 翻身：头歪一下、被子跟着晃 */
  #sleepScene.is-turn #sleepBody { animation: body-turn 2.8s ease-in-out; }
  @keyframes body-turn {
    0%, 100% { transform: translateX(-50%) rotate(0deg); }
    35%      { transform: translateX(-51.5%) rotate(-3.5deg); }
    70%      { transform: translateX(-50.6%) rotate(1.2deg); }
  }
  #sleepDuvet {
    opacity: 0; transform: translateY(11%) scale(1.03);
    transform-origin: 50% 100%;
    transition: transform 1.15s cubic-bezier(.22,.85,.28,1), opacity .85s ease;
    will-change: transform, opacity;
  }
  #sleepScene.is-on #sleepDuvet {
    opacity: 1; transform: none;
    animation: duvet-breathe 5.6s ease-in-out 1.5s infinite;
  }
  @keyframes duvet-breathe {
    0%, 100% { transform: translateY(0) scaleY(1); }
    50%      { transform: translateY(-.35%) scaleY(1.006); }
  }
  #sleepScene.is-turn #sleepDuvet { animation: duvet-turn 2.8s ease-in-out; }
  @keyframes duvet-turn {
    0%, 100% { transform: translate(0, 0) scaleY(1); }
    40%      { transform: translateX(-.25%) scaleY(.998); }
    75%      { transform: translateX(.2%) scaleY(1.002); }
  }
  #sleepZzz {
    position: absolute; left: 44%; top: 36%; font-size: 13px; color: #b9cdff;
    opacity: 0; transition: opacity 1s;
  }
  #sleepScene.is-on #sleepZzz { opacity: .8; animation: floatz 3.2s ease-in-out infinite; }

  /* ── 气泡 ── */
  .bubble {
    position: absolute; left: 50%; bottom: 64%;
    width: max-content; max-width: min(30vw, 380px);
    padding: 10px 14px;
    border-radius: 14px 14px 14px 4px;
    background: rgba(232, 240, 255, 0.95);
    color: #16213a; font-size: 13px; line-height: 1.45;
    box-shadow: 0 12px 26px rgba(0, 0, 0, 0.4);
    transform: translateX(-50%);
    z-index: 6;
    transition: opacity .5s, transform .5s;
  }
  .bubble:empty { opacity: 0; transform: translateX(-50%) translateY(6px); }
  .bubble::after { content: ""; position: absolute; left: 15px; bottom: -8px; border: 8px solid transparent; border-top-color: rgba(232, 240, 255, .95); border-bottom: 0; }

  /* ── HUD ── */
  .hud { position: absolute; inset: 0; pointer-events: none; z-index: 8; }
  .card {
    position: absolute;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    backdrop-filter: blur(10px);
    padding: 12px 14px;
  }
  .identity { left: 3%; top: 4%; min-width: 240px; }
  .identity .name { display: flex; align-items: baseline; gap: 8px; font-size: 17px; font-weight: 600; letter-spacing: .5px; }
  .identity .nick { font-size: 11px; color: var(--dim); }
  .identity .doing { margin-top: 6px; font-size: 13px; color: #cfe0ff; }
  .identity .doing b { color: var(--warm); font-weight: 600; }
  .identity .doing.asleep b { color: #9fc0ff; }
  .identity .since { margin-top: 2px; font-size: 11px; color: var(--dim); }

  .status { right: 3%; top: 4%; min-width: 210px; text-align: right; }
  .status .clock { font: 600 22px/1 ui-monospace, SFMono-Regular, monospace; letter-spacing: 1px; }
  .status .mood { margin-top: 6px; font-size: 12px; color: #cbd8f5; }
  .bar { margin-top: 10px; height: 6px; border-radius: 6px; background: rgba(120, 160, 235, 0.16); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #4f8bff, #7ee0c0); transition: width 1s; }
  .bar-label { margin-top: 4px; font-size: 10px; color: var(--dim); letter-spacing: .8px; }

  .meals { left: 3%; bottom: 4%; min-width: 230px; }
  .meals .title { font-size: 11px; letter-spacing: 1px; color: var(--dim); }
  .meals .row { margin-top: 6px; font-size: 12px; color: #dbe6ff; }
  .meals .bowls { display: flex; gap: 6px; margin-top: 8px; }
  .meals .b { width: 16px; height: 10px; border-radius: 0 0 10px 10px; background: #dfe8ff; opacity: .9; }
  .meals .b.empty { background: rgba(140, 170, 235, 0.18); }

  .recent { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; max-width: 320px; }
  .recent i { font-size: 10px; letter-spacing: 1px; color: var(--dim); font-style: normal; }
  .recent span { font-size: 10.5px; color: #a8b8dd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recent b { color: #7f92bb; font-weight: 400; font-family: ui-monospace, monospace; margin-right: 5px; }
  .offline { color: #ff9d9d; }
</style>
</head>
<body>
  <div class="stage">
    <img class="room" id="roomBg" src="/assets/room-bg.png" alt="" />
    <div class="vignette"></div>

    <!-- 睡觉特写：空床 ← 被子 ← 睡脸（同一机位的三层，见 #sleepScene 的样式注释） -->
    <div id="sleepScene" aria-hidden="true">
      <div class="sleep-zoom">
        <img id="sleepBg" src="/assets/bed-bg.png" alt="" />
        <img id="sleepBody" src="/assets/sleep-body.png" alt="小鲸靠在床头睡着了" />
        <img id="sleepDuvet" src="/assets/bed-duvet.png" alt="" />
        <div id="sleepZzz">z z z</div>
      </div>
    </div>

    <div id="herShadow"></div>
    <div class="bubble" id="bubble"></div>
    <div id="her" data-scene="idle">
      <video id="herVideo" class="is-on" muted loop playsinline autoplay preload="auto" poster="/assets/xixi.png"></video>
      <video id="herVideoB" muted loop playsinline preload="auto"></video>
      <div class="zzz">z z z</div>
    </div>

    <div id="hotspots"></div>
    <div id="hint">点房间里的家具，她会自己过去</div>
    <button id="sleepMode" type="button">睡觉：床边特写</button>

    <div class="hud">
      <div class="card identity">
        <div class="name">小鲸 <span class="nick">机器人账号 · 第七机房 · 靠窗第二个机柜</span></div>
        <div class="doing" id="doing">正在连上她的生活状态…</div>
        <div class="since" id="since"></div>
        <div class="recent" id="recent"></div>
      </div>
      <div class="card status">
        <div class="clock" id="clock">--:--</div>
        <div class="mood" id="mood">心情：—</div>
        <div class="bar"><i id="energy" style="width:0%"></i></div>
        <div class="bar-label">电量 <span id="energyText">0</span> / 100</div>
      </div>
      <div class="card meals">
        <div class="title">今天吃了</div>
        <div class="row" id="meals">—</div>
        <div class="bowls" id="bowls"></div>
      </div>
    </div>
    <div class="house-credit" id="houseCredit" hidden></div>
  </div>

<script type="module">
  // 同一套页面逻辑，可以挂两块地板：
  //   默认  = walk.mjs（Blender 渲的透视房间）
  //   ?house=1 = house.mjs（dsh-in-home 的娃娃屋图，MIT · 星主）
  const QUERY = new URLSearchParams(location.search);
  const HOUSE = QUERY.has('house');
  const FLOOR = await import(HOUSE ? './house.mjs' : './walk.mjs');
  const {
    NODES,
    route,
    lengthMs,
    pointsLength,
    pointOnPoints,
    scaleAt,
    feetAt,
    pickStroll,
    SPRITE_BASE_HEIGHT,
    NATIVE_FACING,
    HOTSPOTS,
  } = FLOOR;

  const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  function fmtAgo(min) {
    if (!min || min < 1) return '刚刚';
    if (min < 60) return `${min} 分钟`;
    const h = Math.floor(min / 60);
    return `${h} 小时 ${min % 60} 分`;
  }

  // 每个场景配一段她的动作（都来自 dsh-pet 那 106 段）
  const CLIPS = {
    idle: '/assets/idle.webm',       // 待机呼吸休闲
    work: '/assets/work.webm',       // 写代码
    eat: '/assets/eat.webm',         // 吃白饭
    phone: '/assets/phone.webm',     // 对屏碎碎念（刷抖音）
    sleep: '/assets/sleep.webm',     // 原地小憩沉眠（坐着打盹）
    window: '/assets/window.webm',   // 东张西望（窗边发呆）
    walk: '/assets/walk-ai.webm',    // AI 生成的横走循环（无缝首尾 + 轻度平滑 + 60fps）
    walkAi: '/assets/ai.webm',       // AI 生成的向前走循环（同流程，另一版）
    walkFloat: '/assets/float.webm', // 原地漂浮踏步（dsh-pet 原素材，对比用）
    walkCrab: '/assets/walk.webm',   // 螃蟹走路（会整个人歪过去，对比用）
    walkRun: '/assets/run.webm',     // 原地左转奔跑（插件用的那段，对比用）
    rubik: '/assets/rubik.webm',     // 原地专心玩魔方（摸鱼）
    think: '/assets/think.webm',     // 深度思考碎碎念
    hum: '/assets/hum.webm',         // 悠闲哼歌
    yawn: '/assets/yawn.webm',       // 哈欠连天（深夜还醒着）
    stretch: '/assets/stretch.webm', // 超大伸懒腰（早上刚起）
    dance: '/assets/happy.webm',     // 可爱宅舞（被夸）
    sulk: '/assets/sulk.webm',       // 傲娇生气（被叫机器人账号）
    outfit: '/assets/outfit.webm',   // 整体换装试色（点衣柜）
    rack: '/assets/rack.webm',       // 清点归档（点机柜）
    cook: '/assets/cook.webm',       // 涮火锅（点饭锅）
  };

  // 房间是 Blender 渲的透视图：站位、路点、透视缩放都在 walk.mjs 里
  const params = QUERY;
  const FORCED_SCENE = params.get('scene');
  const FORCED_EMOTE = params.get('emote');
  const FORCE_STROLL = params.has('stroll');
  const WALK_DEMO = (params.get('walk') || '').split(',').filter(Boolean); // 调试：按顺序走一圈
  const NOWALK = params.has('nowalk'); // 调试：不播走路，直接站过去
  const ROOM_BG_OPEN = '/assets/room-bg.png';
  const ROOM_BG_CLOSED = '/assets/room-bg-curtain.png';
  const AT = params.get('at');         // 调试：?at=21.3,6 把她摆到指定点
  // 调试：?walkclip=float|ai|ai2|crab|run 换一段走路动作对比
  const WALK_ALIAS = {
    crab: 'walk',
    float: 'float',
    ai: 'ai',
    ai30: 'walk-ai-30',
    ai60: 'walk-ai',
    run: 'run',
  };
  const WALK_SRC = params.get('walkclip')
    ? `/assets/${WALK_ALIAS[params.get('walkclip')] ?? params.get('walkclip')}.webm`
    : CLIPS.walk;

  const her = document.getElementById('her');
  const videoA = document.getElementById('herVideo');
  const videoB = document.getElementById('herVideoB');
  let activeVideo = videoA;
  let currentClip = '';
  const shadow = document.getElementById('herShadow');
  const bubbleEl = document.getElementById('bubble');
  const roomBg = document.getElementById('roomBg');
  const stageEl = document.querySelector('.stage');

  let currentNode = 'idle';   // 她正站在哪个落脚点上（走一半被打断会变成 null）
  let currentPos = { x: NODES.idle.x, bottom: NODES.idle.bottom };
  let sceneNow = null;        // 正在演的场景
  let emoteKey = null;
  let emoteTimer = 0;
  let busy = false;           // 正在走/正在演
  let strolling = false;
  let sleeping = false;
  let nextStrollAt = Date.now() + 9000;
  let curtainsClosed = false;
  let interactUntil = 0;      // 家具交互进行到什么时候（期间不自动切场景）
  let interactLabel = '';
  let manualBubble = '';
  let manualBubbleUntil = 0;
  let epoch = 0;              // 每次取消当前动作 +1；异步流程用它对表
  let facing = 1;
  let lastState = null;
  const demoStart = Date.now();

  /* ────────── 睡觉特写：上床 → 盖被 → 呼吸 → 翻身 → 掀被起床 ────────── */

  const sleepSceneEl = document.getElementById('sleepScene');
  const hintNode = document.getElementById('hint');   // 页尾还有一份 hintEl（9 秒后淡出那条），别重名
  const HINT_TEXT = hintNode.textContent;

  /* 睡法：closeup=床边特写，room=大房间里远远看她睡（不切镜头） */
  const SLEEP_MODE_LABEL = { closeup: '睡觉：床边特写', room: '睡觉：房里远景' };
  const sleepModeBtn = document.getElementById('sleepMode');
  let sleepView = QUERY.get('sleepview');
  if (!SLEEP_MODE_LABEL[sleepView]) {
    try { sleepView = localStorage.getItem('xixi.sleepview') || ''; } catch { sleepView = ''; }
  }
  if (!SLEEP_MODE_LABEL[sleepView]) sleepView = 'closeup';
  const paintSleepMode = () => { sleepModeBtn.textContent = SLEEP_MODE_LABEL[sleepView]; };
  paintSleepMode();
  sleepModeBtn.addEventListener('click', async () => {
    sleepView = sleepView === 'closeup' ? 'room' : 'closeup';
    try { localStorage.setItem('xixi.sleepview', sleepView); } catch { /* 隐身窗口存不了，无所谓 */ }
    paintSleepMode();
    // 正在睡着就立刻换一种睡法，不用等他再点
    if (inBed) await getUp({ manual: true });
    sceneNow = null;
    tick();
  });
  // 仓库里不同步 assets/：床边特写的图不在就退回旧的打盹片段，别让床变成一块空白
  const SLEEP_SCENE_OK = await new Promise((resolve) => {
    const probe = new Image();
    probe.onload = () => resolve(true);
    probe.onerror = () => resolve(false);
    probe.src = '/assets/bed-bg.png';
  });
  let inBed = false;       // 正在床边特写里睡着
  let turnTimer = 0;
  // 手动叫醒后这段时间内不再自动躺回去（夜里状态一直说「在睡」，不然刚睁眼又被塞回被窝）
  let wakeHoldUntil = 0;

  /** 走到床边后调：画面切到床边，被子盖上来，睡脸露在枕头上 */
  async function tuckIn() {
    if (inBed) return;
    inBed = true;
    sleeping = true;
    stageEl.classList.add('asleep');
    shadow.style.opacity = '0';
    // 立绘淡出（她躺进被子里了），剩下枕头上那张睡脸
    her.style.transition = 'opacity .5s ease';
    her.style.opacity = '0';
    sleepSceneEl.classList.add('is-on');
    hintNode.textContent = '点一下叫她起来';
    hintNode.style.opacity = '1';
    clearInterval(turnTimer);
    turnTimer = setInterval(() => {
      if (!inBed) return;
      sleepSceneEl.classList.add('is-turn');
      setTimeout(() => sleepSceneEl.classList.remove('is-turn'), 3000);
    }, 22000 + Math.random() * 20000);
  }

  /** 掀被子起床：先把被子滑下去，再把人露出来 */
  async function getUp({ manual = false } = {}) {
    if (!inBed) return;
    inBed = false;
    if (manual) wakeHoldUntil = Date.now() + 10 * 60_000;
    clearInterval(turnTimer);
    sleepSceneEl.classList.remove('is-turn');
    sleepSceneEl.classList.remove('is-on');
    hintNode.textContent = HINT_TEXT;
    hintNode.style.opacity = '0';   // 通用提示早该淡出了，别又冒出来
    await new Promise((resolve) => setTimeout(resolve, 750));
    her.style.opacity = '';
    her.style.transition = '';
    sleeping = false;
    stageEl.classList.remove('asleep');
    shadow.style.opacity = '';
  }

  /* ────────── 摆位置：left/bottom 百分比 + 透视缩放 ────────── */

  /* 走路素材原生朝哪边：朝左的素材往右走要镜像，脸才朝着走的方向。
     11-01 反馈「从左往右走脸是朝左看」——原来写死「往左才镜像」，正好反了。 */
  const NATIVE_SIGN = NATIVE_FACING === 'left' ? -1 : 1;

  function pose(x, bottom, dirX = 0, bob = 0, tilt = 0) {
    if (Math.abs(dirX) > 0.3) facing = Math.sign(dirX) === NATIVE_SIGN ? 1 : -1;
    currentPos = { x, bottom };
    const scale = scaleAt(bottom);
    const lift = Math.max(0, bob);
    her.style.left = `${x.toFixed(3)}%`;
    her.style.bottom = `${bottom.toFixed(3)}%`;
    her.style.transform =
      `translateX(-50%) translateY(${(-lift).toFixed(2)}%) rotate(${tilt.toFixed(2)}deg) ` +
      `scale(${scale}) scaleX(${facing < 0 ? -1 : 1})`;
    // 影子跟着立绘大小：宽约立绘一半、高按基础高度等比缩
    const shadowH = 2.2 * (SPRITE_BASE_HEIGHT / 62);
    shadow.style.left = `${x.toFixed(3)}%`;
    shadow.style.bottom = `${(feetAt(bottom) - shadowH / 2).toFixed(3)}%`;
    shadow.style.width = `${(0.152 * SPRITE_BASE_HEIGHT * scale).toFixed(3)}%`;
    shadow.style.height = `${shadowH.toFixed(3)}%`;
    const head = bottom + SPRITE_BASE_HEIGHT * scale * 0.83 + 1.6;
    bubbleEl.style.left = `${x.toFixed(3)}%`;
    bubbleEl.style.bottom = `${head.toFixed(3)}%`;
  }

  /**
   * 换动作：两块 <video> 轮着来，用 opacity 交叉淡入淡出。
   * 好处：换片段不用重新 load/decode（一起播着切透明度），也不会从上一帧硬切到下一帧。
   */
  function setClip(src, { restart = false } = {}) {
    if (!src || currentClip === src) return;
    const next = activeVideo === videoA ? videoB : videoA;
    const old = activeVideo;
    if (next.dataset.src !== src) {
      next.dataset.src = src;
      next.src = src;
      next.currentTime = 0;
    } else if (restart) {
      try {
        next.currentTime = 0;
      } catch {
        /* 还没加载好就算了 */
      }
    }
    next.play().catch(() => {});
    next.style.visibility = '';
    next.style.transition = 'opacity .16s linear';
    next.classList.add('is-on');
    old.style.transition = 'opacity .16s linear';
    old.classList.remove('is-on');
    activeVideo = next;
    currentClip = src;
    her.dataset.clip = src;
    // 淡完就把退出那块彻底收起来 + 去掉 transition：
    // 视频上常驻 opacity/transition 会让 Chromium 一直合成它，整页被拖到 30fps
    setTimeout(() => {
      if (old !== activeVideo) {
        old.pause();
        old.style.transition = 'none';
      }
      next.style.transition = 'none';
    }, 200);
  }

  function wait(ms, myEpoch) {
    return new Promise((resolve) => {
      setTimeout(() => resolve(epoch === myEpoch), ms);
    });
  }

  function cancelActivity() {
    epoch += 1;
    busy = false;
    strolling = false;
    // 可能走了一半被打断：落点未知，交给 planTo 就近接上
    currentNode = null;
  }

  /* ────────── 走路：沿路点插值，速度按实际距离算 ────────── */

  function walkPoints(points) {
    const myEpoch = epoch;
    return new Promise((resolve) => {
      if (!points || points.length < 2) {
        resolve(true);
        return;
      }
      if (NOWALK) {
        const last = points[points.length - 1];
        pose(last.x, last.bottom);
        resolve(true);
        return;
      }
      const total = pointsLength(points);
      const ms = lengthMs(points);

      const start = performance.now();
      const step = (now) => {
        if (epoch !== myEpoch) {
          resolve(false);
          return;
        }
        const t = Math.min(1, (now - start) / ms);
        const p = pointOnPoints(points, total * t);
        // 走路的「步态」：两步一个循环，落地时最低、身体跟着轻摆；停下就归零
        const phase = now / 230;
        const bob = 0.7 * Math.abs(Math.sin(phase));
        const tilt = 0.5 * Math.sin(phase);
        pose(p.x, p.bottom, p.dirX, bob, tilt);
        if (t >= 1) {
          pose(p.x, p.bottom, p.dirX, 0, 0);
          resolve(true);
        } else requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  }

  /** 从她现在的位置出发，走到某个落脚点要经过哪些点。 */
  function planTo(key) {
    if (currentNode === key) return null;
    let startKey = currentNode;
    if (!startKey) {
      // 走一半被打断：就近找个落脚点接上
      let best = null;
      for (const name of Object.keys(NODES)) {
        const d = Math.hypot((NODES[name].x - currentPos.x) * (16 / 9), NODES[name].bottom - currentPos.bottom);
        if (best === null || d < best.d) best = { name, d };
      }
      startKey = best.name;
    }
    const keys = route(startKey, key);
    const points = keys.map((name) => ({ ...NODES[name] }));
    const first = points[0];
    if (!currentNode && (Math.abs(first.x - currentPos.x) > 0.15 || Math.abs(first.bottom - currentPos.bottom) > 0.15)) {
      points.unshift({ ...currentPos });
    }
    return points;
  }

  async function goAndAct(key, clipSrc, scene) {
    const myEpoch = epoch;
    const points = planTo(key);
    if (points) {
      setClip(WALK_SRC, { restart: true });
      const ok = await walkPoints(points);
      if (!ok || epoch !== myEpoch) return;
      currentNode = key;
    }
    if (epoch !== myEpoch) return;
    setClip(clipSrc);
    her.dataset.scene = scene;
  }

  /* ────────── 闲逛：每半分钟起来走一圈，再回去干活 ────────── */

  function clipForStop(key) {
    if (key === 'window') return CLIPS.window;
    if (key === 'shelfF') return CLIPS.think;
    if (key === 'bedF') return CLIPS.yawn;
    return Math.random() < 0.35 ? CLIPS.hum : CLIPS.idle;
  }

  async function startStroll(scene) {
    if (strolling) return;
    const myEpoch = epoch;
    strolling = true;
    busy = true;
    try {
      const picks = pickStroll(currentNode ?? 'idle');
      for (const key of picks) {
        if (epoch !== myEpoch) return;
        const points = planTo(key);
        if (points) {
          setClip(WALK_SRC, { restart: true });
          const ok = await walkPoints(points);
          if (!ok || epoch !== myEpoch) return;
          currentNode = key;
        }
        setClip(clipForStop(key));
        const alive = await wait(1300 + Math.random() * 2400, myEpoch);
        if (!alive || epoch !== myEpoch) return;
      }
      if (epoch !== myEpoch) return;
      const back = planTo(scene);
      if (back) {
        setClip(WALK_SRC, { restart: true });
        const ok = await walkPoints(back);
        if (!ok || epoch !== myEpoch) return;
        currentNode = scene;
      }
      if (epoch !== myEpoch) return;
      setClip(CLIPS[scene] ?? CLIPS.idle);
      her.dataset.scene = scene;
    } finally {
      if (epoch === myEpoch) {
        strolling = false;
        busy = false;
        nextStrollAt = Date.now() + 18000 + Math.random() * 26000;
      }
    }
  }

  /* ────────── 一个场景：走到位置上，再播那一幕 ────────── */

  async function enterScene(scene) {
    cancelActivity();
    const myEpoch = epoch;
    busy = true;
    if (inBed) await getUp();   // 从床上起来再走（掀被子的过渡要播完）
    sleeping = false;
    stageEl.classList.remove('asleep');
    shadow.style.opacity = '';

    // 睡觉走的是床沿：不走床垫上那个点，免得人站在褥子上凭空消失
    const target = scene === 'sleep' ? (NODES.bedF ? 'bedF' : NODES.bedSide ? 'bedSide' : scene) : scene;
    const points = planTo(target);
    if (points) {
      setClip(WALK_SRC, { restart: true });
      const ok = await walkPoints(points);
      if (!ok || epoch !== myEpoch) return;
      currentNode = target;
    }
    if (epoch !== myEpoch) return;

    if (scene === 'sleep') {
      her.dataset.scene = 'sleep';
      if (HOUSE || !SLEEP_SCENE_OK || sleepView === 'room') {
        // 小屋那套素材没有床边特写；远景模式也是：人留在房间里，远远看她睡
        setClip(CLIPS.sleep);
        sleeping = true;
        stageEl.classList.add('asleep');
        shadow.style.opacity = '0';
        hintNode.textContent = '她睡着了 · 点一下就叫她起来';
        hintNode.style.opacity = '1';
      } else {
        await tuckIn();
      }
    } else {
      setClip(CLIPS[scene] ?? CLIPS.idle);
      her.dataset.scene = scene;
      if (hintNode.textContent !== HINT_TEXT) {
        hintNode.textContent = HINT_TEXT;
        hintNode.style.opacity = '0';
      }
    }
    busy = false;
    nextStrollAt = Date.now() + (FORCE_STROLL ? 5000 : 18000 + Math.random() * 26000);
  }

  /* ────────── 反应：被夸跳舞 / 被叫机器人账号生气 ────────── */

  function startEmote(emote) {
    cancelActivity();
    const myEpoch = epoch;
    emoteKey = emote.key;
    sleeping = false;
    stageEl.classList.remove('asleep');
    shadow.style.opacity = '';
    her.dataset.scene = emote.clip;
    setClip(CLIPS[emote.clip]);
    const ms = emote.until === Infinity ? Infinity : Math.max(400, emote.until - Date.now());
    clearTimeout(emoteTimer);
    if (ms !== Infinity) {
      emoteTimer = setTimeout(() => {
        if (epoch !== myEpoch) return;
        emoteKey = null;
        emoteTimer = 0;
        sceneNow = null; // 下一轮重新回到场景
        tick();
      }, ms);
    }
  }

  /* ────────── 家具交互：点一下，她自己过去 ────────── */

  function say(text, ms = 6000) {
    manualBubble = text;
    manualBubbleUntil = Date.now() + ms;
  }

  async function interactFurniture(spot) {
    if (!spot) return;

    // 睡着的时候点任何东西 = 叫她起来（先起床，这一下不干别的）
    if (inBed) {
      cancelActivity();
      busy = true;
      await getUp({ manual: true });
      her.dataset.scene = 'idle';
      setClip(CLIPS.stretch ?? CLIPS.idle);
      say('唔…人家还没睡够');
      sceneNow = null;
      nextStrollAt = Date.now() + 12000;
      busy = false;
      tick();
      return;
    }

    cancelActivity();
    const myEpoch = epoch;
    busy = true;
    sleeping = false;
    stageEl.classList.remove('asleep');
    shadow.style.opacity = '';

    // 窗帘：切一张「拉上窗帘」的渲染图
    if (spot.curtain) {
      curtainsClosed = !curtainsClosed;
      roomBg.src = curtainsClosed ? ROOM_BG_CLOSED : ROOM_BG_OPEN;
      say(curtainsClosed ? '拉上窗帘，屋里一下安静了' : '拉开看看月亮');
      interactLabel = '窗帘';
      interactUntil = Date.now() + 9000;
      busy = false;
      tick();
      return;
    }

    // 站在原地的交互（够不到的机柜之类）：只播动作 + 冒一句
    if (spot.stay) {
      her.dataset.scene = spot.clip;
      setClip(CLIPS[spot.clip] ?? CLIPS.idle);
      const stayLines = spot.lines ?? [];
      say(stayLines[Math.floor(Math.random() * stayLines.length)] ?? '……');
      interactLabel = spot.label;
      interactUntil = Date.now() + 15000 + Math.random() * 10000;
      sceneNow = null;
      busy = false;
      tick();
      return;
    }

    // 灯：走过去也够不到，直接按开关
    if (spot.lamp) {
      stageEl.classList.toggle('lights-off');
      say(stageEl.classList.contains('lights-off') ? '关灯，省点电' : '开灯，继续干活');
      interactLabel = '灯';
      interactUntil = Date.now() + 9000;
      busy = false;
      tick();
      return;
    }

    const points = planTo(spot.node);
    if (points) {
      setClip(WALK_SRC, { restart: true });
      const ok = await walkPoints(points);
      if (!ok || epoch !== myEpoch) return;
      currentNode = spot.node;
    }
    if (epoch !== myEpoch) return;

    // 床：不是"走过去坐一下"，是上床盖被子（小屋版没有这套特写，走老路）
    if (spot.clip === 'sleep' && !HOUSE && SLEEP_SCENE_OK) {
      her.dataset.scene = 'sleep';
      await tuckIn();
      const bedLines = spot.lines ?? [];
      say(bedLines[Math.floor(Math.random() * bedLines.length)] ?? '晚安…');
      sceneNow = 'sleep';
      busy = false;
      tick();
      return;
    }

    her.dataset.scene = spot.clip;
    setClip(CLIPS[spot.clip] ?? CLIPS.idle);
    const lines = spot.lines ?? [];
    say(lines[Math.floor(Math.random() * lines.length)] ?? '……');
    interactLabel = spot.label;
    interactUntil = Date.now() + 18000 + Math.random() * 12000;
    sceneNow = null;
    busy = false;
    tick();
  }

  /* ────────── 画面/HUD ────────── */

  function paintHud(state, scene, emote, doingText = '') {
    const reacting = Boolean(emote);
    const doing = document.getElementById('doing');
    if (doingText) {
      doing.className = 'doing';
      doing.innerHTML = doingText;
    } else if (scene === 'sleep' && !reacting) {
      doing.className = 'doing asleep';
      doing.innerHTML = `此刻：<b>睡着了</b>${state.bedtime ? ' · 夜深了，别吵她' : ' · 缩在床上打盹'}`;
    } else {
      doing.className = 'doing';
      doing.innerHTML = `此刻：<b>${esc(state.activity)}</b>`;
    }

    document.getElementById('since').textContent = scene === 'sleep'
      ? '呼…'
      : state.activityMinutes
        ? `已经 ${fmtAgo(state.activityMinutes)}了`
        : '';

    document.getElementById('clock').textContent = state.clock;
    document.getElementById('mood').textContent = `心情：${state.mood}`;
    document.getElementById('energy').style.width = `${state.energy}%`;
    document.getElementById('energyText').textContent = state.energy;

    const m = state.meals;
    document.getElementById('meals').textContent = m.todayCount
      ? `${m.todayCount} 顿：${m.today.join(' / ')}`
      : '还没吃（账本空着）';

    const bowls = document.getElementById('bowls');
    bowls.innerHTML = '';
    const slots = ['早饭', '午饭', '晚饭', '宵夜'];
    for (const slot of slots) {
      const b = document.createElement('div');
      b.className = 'b' + (m.today.some((t) => t.startsWith(slot)) ? '' : ' empty');
      b.title = slot;
      bowls.appendChild(b);
    }

    const recent = document.getElementById('recent');
    recent.innerHTML = '<i>最近</i>';
    for (const item of (state.timeline ?? []).slice(-3)) {
      const t = new Date(item.at);
      const span = document.createElement('span');
      span.innerHTML = `<b>${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}</b>${esc(item.who)}：${esc(item.text)}`;
      recent.appendChild(span);
    }

    bubbleEl.textContent = Date.now() < manualBubbleUntil
      ? manualBubble
      : scene === 'sleep' && !reacting
        ? ''
        : reacting && !FORCED_EMOTE
          ? state.emote.reason
          : state.latest?.text ?? '';
  }

  function paint(state) {
    lastState = state;
    const now = Date.now();
    const demoIdx = WALK_DEMO.length ? Math.floor((now - demoStart) / 4000) % WALK_DEMO.length : -1;
    let scene = FORCED_SCENE || (demoIdx >= 0 ? WALK_DEMO[demoIdx] : null) || state.scene || 'idle';
    // 她刚被手动叫醒：状态还写着「在睡」，也先给她十分钟清醒，不然一睁眼又被塞回被窝
    if (scene === 'sleep' && !FORCED_SCENE && Date.now() < wakeHoldUntil) scene = 'yawn';

    const emote = FORCED_EMOTE
      ? { clip: FORCED_EMOTE, key: `forced:${FORCED_EMOTE}`, reason: '', until: Infinity }
      : state.emote && state.emote.until > now
        ? state.emote
        : null;

    // 反应（事件）优先于场景（状态）
    if (emote && emote.key !== emoteKey) {
      startEmote(emote);
    } else if (!emote && emoteKey) {
      emoteKey = null;
      clearTimeout(emoteTimer);
      emoteTimer = 0;
      sceneNow = null;
    }

    // 小屋版跟着她的钟点换白天/夜晚（20 点以后算夜里）
    if (HOUSE) {
      const nightNow = state.hour >= 20 || state.hour < 7;
      if (roomBg.dataset.night !== String(nightNow)) {
        roomBg.dataset.night = String(nightNow);
        roomBg.src = nightNow ? '/assets/hut-night.webp' : '/assets/hut-day.webp';
      }
    }

    // 家具交互中：只刷新 HUD/气泡，不自动切场景（交互结束再回去干活）
    if (interactUntil && now >= interactUntil) {
      interactUntil = 0;
      interactLabel = '';
      sceneNow = null;
    }
    if (now < interactUntil) {
      paintHud(state, her.dataset.scene || scene, null, `此刻：在<b>${esc(interactLabel)}</b>那边`);
      return;
    }

    paintHud(state, scene, emote);
    if (emoteKey) return;

    // 调试：?walk=a,b,c 让她每 4 秒走到下一个地方（录演示用）
    if (WALK_DEMO.length > 0) {
      if (!busy && !strolling && sceneNow !== scene) {
        sceneNow = scene;
        void enterScene(scene);
      }
      return;
    }

    // 调试：?at=x,bottom 把她钉在指定位置，方便调站位
    if (AT) {
      setClip(CLIPS[scene] ?? CLIPS.idle);
      her.dataset.scene = scene;
      stageEl.classList.toggle('asleep', scene === 'sleep');
      return;
    }

    if (scene !== sceneNow) {
      sceneNow = scene;
      void enterScene(scene);
      return;
    }

    if (!busy && !strolling && !inBed && Date.now() >= nextStrollAt && scene !== 'sleep') {
      void startStroll(scene);
    }
  }

  let offline = false;
  async function tick() {
    try {
      const res = await fetch('/api/state', { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      paint(await res.json());
      if (offline) {
        offline = false;
        document.getElementById('doing').classList.remove('offline');
      }
    } catch (error) {
      offline = true;
      const doing = document.getElementById('doing');
      doing.classList.add('offline');
      doing.textContent = `连不上房间服务（${error.message}）`;
    }
  }

  // 开屏：A 播 idle，B 提前把走路片段 load 好，第一次走就不用等解码
  videoA.src = CLIPS.idle;
  videoA.dataset.src = CLIPS.idle;
  videoA.play().catch(() => {});
  currentClip = CLIPS.idle;
  videoB.src = WALK_SRC;
  videoB.dataset.src = WALK_SRC;

  // 小屋版：换舞台比例、立绘大小、底图和署名
  if (HOUSE) {
    stageEl.classList.add('house');
    her.style.height = `${SPRITE_BASE_HEIGHT}%`;
    roomBg.dataset.night = 'true';
    roomBg.src = '/assets/hut-night.webp';
    const credit = document.getElementById('houseCredit');
    credit.hidden = false;
    credit.textContent = '小屋素材：dsh-in-home · 星主（MIT）';
  }

  // 家具热区：点一下她会走过去做点什么
  const hotspotLayer = document.getElementById('hotspots');
  for (const spot of HOTSPOTS ?? []) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'hotspot';
    btn.dataset.label = spot.label;
    btn.title = spot.label;
    btn.style.left = `${spot.left}%`;
    btn.style.top = `${spot.top}%`;
    btn.style.width = `${spot.w}%`;
    btn.style.height = `${spot.h}%`;
    btn.addEventListener('click', () => void interactFurniture(spot));
    hotspotLayer.appendChild(btn);
  }
  const hintEl = document.getElementById('hint');
  if (hintEl) setTimeout(() => { hintEl.style.opacity = '0'; }, 9000);

  // 开屏先站在地毯中间，然后自己走到该去的地方
  if (AT) {
    const [x, bottom] = AT.split(',').map(Number);
    currentNode = null;
    pose(x, bottom);
  } else {
    pose(NODES.idle.x, NODES.idle.bottom);
  }

  tick();
  setInterval(tick, 3000);
</script>
</body>
</html>
