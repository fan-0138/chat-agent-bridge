<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>小鲸的房间</title>
<style>
  :root {
    --ink: #e8eeff;
    --dim: #8fa0c8;
    --accent: #6ea8ff;
    --warm: #ffcf8a;
    --panel: rgba(12, 18, 34, 0.7);
    --line: rgba(140, 170, 255, 0.18);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at 70% 10%, #16233d 0%, #070b15 62%, #05070d 100%);
    color: var(--ink);
    font: 14px/1.5 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  /* ── 整个画面 ── */
  .stage {
    position: relative;
    width: min(96vw, calc(96vh * 16 / 9));
    aspect-ratio: 16 / 9;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(120, 150, 220, 0.14);
    background: #0b1220;
  }
  .room { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; z-index: 1; }
  .vignette {
    position: absolute; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(ellipse at 50% 46%, rgba(4, 6, 12, 0) 52%, rgba(4, 6, 12, .34) 100%);
  }

  /* ── 她 ── */
  #her {
    position: absolute;
    height: 62%;
    left: 50%; bottom: 18%;
    transform-origin: 50% 100%;
    transform: translateX(-50%) scale(1);
    transition: left 1.4s cubic-bezier(.4, .1, .2, 1), bottom 1.4s cubic-bezier(.4, .1, .2, 1),
      transform 1.4s cubic-bezier(.4, .1, .2, 1), filter .8s;
    filter: drop-shadow(0 14px 18px rgba(0, 0, 0, 0.55));
    z-index: 4;
  }
  #her video { height: 100%; width: auto; display: block; }
  /* 睡觉那一幕：整段压暗 */
  #her[data-scene="sleep"] video { filter: brightness(.72) saturate(.85); }

  /* 她脚下那摊影子：跟着走、跟着远近变大变小 */
  #herShadow {
    position: absolute;
    z-index: 3;
    left: 50%; bottom: 17%;
    width: 10%; height: 2.6%;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(0, 0, 0, .58), rgba(0, 0, 0, .28) 55%, rgba(0, 0, 0, 0) 72%);
    transition: left 1.4s cubic-bezier(.4, .1, .2, 1), bottom 1.4s cubic-bezier(.4, .1, .2, 1), width .6s;
  }

  /* 睡觉的 zzz */
  .zzz { position: absolute; left: 62%; top: -6%; font-size: 13px; color: #b9cdff; opacity: 0; transition: opacity .6s; }
  #her[data-scene="sleep"] .zzz { opacity: 1; top: 56%; left: 66%; animation: floatz 3.2s ease-in-out infinite; }
  @keyframes floatz { 0% { transform: translate(0, 0); opacity: .2; } 50% { transform: translate(6px, -12px); opacity: .9; } 100% { transform: translate(12px, -24px); opacity: 0; } }

  /* ── 气泡 ── */
  .bubble {
    position: absolute; left: 50%; bottom: 64%;
    width: max-content; max-width: min(30vw, 380px);
    padding: 10px 14px;
    border-radius: 14px 14px 14px 4px;
    background: rgba(232, 240, 255, 0.95);
    color: #16213a; font-size: 13px; line-height: 1.45;
    box-shadow: 0 12px 26px rgba(0, 0, 0, 0.4);
    transform: translateX(-50%);
    z-index: 6;
    transition: left 1.4s cubic-bezier(.4, .1, .2, 1), bottom 1.4s cubic-bezier(.4, .1, .2, 1), opacity .5s, transform .5s;
  }
  .bubble:empty { opacity: 0; transform: translateX(-50%) translateY(6px); }
  .bubble::after { content: ""; position: absolute; left: 15px; bottom: -8px; border: 8px solid transparent; border-top-color: rgba(232, 240, 255, .95); border-bottom: 0; }

  /* ── HUD ── */
  .hud { position: absolute; inset: 0; pointer-events: none; z-index: 8; }
  .card {
    position: absolute;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    backdrop-filter: blur(10px);
    padding: 12px 14px;
  }
  .identity { left: 3%; top: 4%; min-width: 240px; }
  .identity .name { display: flex; align-items: baseline; gap: 8px; font-size: 17px; font-weight: 600; letter-spacing: .5px; }
  .identity .nick { font-size: 11px; color: var(--dim); }
  .identity .doing { margin-top: 6px; font-size: 13px; color: #cfe0ff; }
  .identity .doing b { color: var(--warm); font-weight: 600; }
  .identity .since { margin-top: 2px; font-size: 11px; color: var(--dim); }

  .status { right: 3%; top: 4%; min-width: 210px; text-align: right; }
  .status .clock { font: 600 22px/1 ui-monospace, SFMono-Regular, monospace; letter-spacing: 1px; }
  .status .mood { margin-top: 6px; font-size: 12px; color: #cbd8f5; }
  .bar { margin-top: 10px; height: 6px; border-radius: 6px; background: rgba(120, 160, 235, 0.16); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #4f8bff, #7ee0c0); transition: width 1s; }
  .bar-label { margin-top: 4px; font-size: 10px; color: var(--dim); letter-spacing: .8px; }

  .meals { left: 3%; bottom: 4%; min-width: 230px; }
  .meals .title { font-size: 11px; letter-spacing: 1px; color: var(--dim); }
  .meals .row { margin-top: 6px; font-size: 12px; color: #dbe6ff; }
  .meals .bowls { display: flex; gap: 6px; margin-top: 8px; }
  .meals .b { width: 16px; height: 10px; border-radius: 0 0 10px 10px; background: #dfe8ff; opacity: .9; }
  .meals .b.empty { background: rgba(140, 170, 235, 0.18); }

  .recent { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; max-width: 320px; }
  .recent i { font-size: 10px; letter-spacing: 1px; color: var(--dim); font-style: normal; }
  .recent span { font-size: 10.5px; color: #a8b8dd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recent b { color: #7f92bb; font-weight: 400; font-family: ui-monospace, monospace; margin-right: 5px; }
  .offline { color: #ff9d9d; }

  /* ── 房间里会动的小东西 ── */
  .star { animation: twinkle 3.6s ease-in-out infinite; }
  .bulb { animation: bulbGlow 4.4s ease-in-out infinite; }
  .code-line { animation: codeFlow 5.5s ease-in-out infinite; }
  .code-line:nth-child(2) { animation-delay: .5s; }
  .code-line:nth-child(3) { animation-delay: 1.1s; }
  .code-line:nth-child(4) { animation-delay: 1.7s; }
  .code-line:nth-child(5) { animation-delay: 2.3s; }
  .steam { animation: steamRise 4.2s ease-in-out infinite; }
  .lamp-glow { animation: lampBreathe 6s ease-in-out infinite; }

  @keyframes twinkle { 0%, 100% { opacity: .25; } 50% { opacity: .95; } }
  @keyframes bulbGlow { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  @keyframes codeFlow { 0%, 100% { opacity: .25; } 50% { opacity: .9; } }
  @keyframes steamRise { 0% { opacity: 0; transform: translateY(6px) scale(.8); } 40% { opacity: .55; } 100% { opacity: 0; transform: translateY(-16px) scale(1.25); } }
  @keyframes lampBreathe { 0%, 100% { opacity: .55; } 50% { opacity: .72; } }
</style>
</head>
<body>
  <div class="stage">
    <img class="room" id="roomBg" src="/assets/room-bg.png" alt="" />
    <div class="vignette"></div>

    <div id="herShadow"></div>
    <div class="bubble" id="bubble"></div>
    <div id="her" data-scene="idle">
      <video id="herVideo" muted loop playsinline autoplay preload="auto" poster="/assets/xixi.png"></video>
      <div class="zzz">z z z</div>
    </div>

    <div class="hud">
      <div class="card identity">
        <div class="name">小鲸 <span class="nick">机器人账号 · 第七机房 · 靠窗第二个机柜</span></div>
        <div class="doing" id="doing">正在连上她的生活状态…</div>
        <div class="since" id="since"></div>
        <div class="recent" id="recent"></div>
      </div>
      <div class="card status">
        <div class="clock" id="clock">--:--</div>
        <div class="mood" id="mood">心情：—</div>
        <div class="bar"><i id="energy" style="width:0%"></i></div>
        <div class="bar-label">电量 <span id="energyText">0</span> / 100</div>
      </div>
      <div class="card meals">
        <div class="title">今天吃了</div>
        <div class="row" id="meals">—</div>
        <div class="bowls" id="bowls"></div>
      </div>
    </div>
  </div>

<script>
  const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  function fmtAgo(min) {
    if (!min || min < 1) return '刚刚';
    if (min < 60) return `${min} 分钟`;
    const h = Math.floor(min / 60);
    return `${h} 小时 ${min % 60} 分`;
  }

  // 每个场景配一段她的动作（都来自 dsh-pet 那 106 段）
  const CLIPS = {
    idle: '/assets/idle.webm',       // 待机呼吸休闲
    work: '/assets/work.webm',       // 写代码
    eat: '/assets/eat.webm',         // 吃白饭
    phone: '/assets/phone.webm',     // 对屏碎碎念（刷抖音）
    sleep: '/assets/sleep.webm',     // 原地小憩沉眠
    window: '/assets/window.webm',   // 东张西望（窗边发呆）
    walk: '/assets/walk.webm',       // 螃蟹走路（移动时用）
    rubik: '/assets/rubik.webm',     // 原地专心玩魔方（摸鱼）
    think: '/assets/think.webm',     // 深度思考碎碎念
    hum: '/assets/hum.webm',         // 悠闲哼歌
    yawn: '/assets/yawn.webm',       // 哈欠连天（深夜还醒着）
    stretch: '/assets/stretch.webm', // 超大伸懒腰（早上刚起）
    dance: '/assets/happy.webm',     // 可爱宅舞（被夸）
    sulk: '/assets/sulk.webm',       // 傲娇生气（被叫机器人账号）
  };

  // 房间是 Blender 渲的透视图：站位由 world_to_camera_view 反算出来
  // （bottom/scale 跟着真实透视走，她在窗下自然比在地毯上小）
  const SPOTS = {
    work:    { x: 37.0, bottom: 20.5, scale: .599, bubble: 51.9 },
    think:   { x: 37.3, bottom: 21.8, scale: .583, bubble: 52.4 },
    eat:     { x: 71.5, bottom: 11.7, scale: .720, bubble: 49.0 },
    phone:   { x: 43.2, bottom: 3.9,  scale: .826, bubble: 46.3 },
    rubik:   { x: 56.0, bottom: 6.8,  scale: .787, bubble: 47.3 },
    window:  { x: 65.2, bottom: 20.1, scale: .605, bubble: 54.8 },
    hum:     { x: 63.3, bottom: 16.0, scale: .661, bubble: 53.7 },
    sleep:   { x: 21.3, bottom: 6.0,  scale: .798, bubble: 51.0 },
    yawn:    { x: 51.4, bottom: 14.4, scale: .683, bubble: 49.8 },
    stretch: { x: 53.9, bottom: 10.9, scale: .731, bubble: 48.7 },
    idle:    { x: 50.1, bottom: 9.2,  scale: .755, bubble: 48.1 },
  };

  function bubbleAt(scene) {
    const spot = SPOTS[scene] ?? SPOTS.idle;
    return { left: `${spot.x}%`, bottom: `${spot.bubble}%` };
  }

  let currentX = null;
  let walkTimer = 0;
  let lastScene = 'idle';
  let emoteKey = null;
  let emoteTimer = 0;

  function setClip(video, src) {
    if (!src || video.dataset.src === src) return;
    video.dataset.src = src;
    video.src = src;
    video.play().catch(() => {});
  }

  function placeHer(her, spot, faceLeft) {
    currentX = spot.x;
    her.style.left = `${spot.x}%`;
    her.style.bottom = `${spot.bottom}%`;
    her.style.transform = `translateX(-50%) scale(${spot.scale}) scaleX(${faceLeft ? -1 : 1})`;
    const shadow = document.getElementById('herShadow');
    shadow.style.left = `${spot.x}%`;
    shadow.style.bottom = `${spot.bottom - 1.1}%`;
    shadow.style.width = `${10 * spot.scale}%`;
  }

  /** 走到目标场景的落脚点：走路时播走路动作，到了再换该场景的动作。 */
  function walkTo(video, her, scene) {
    const spot = SPOTS[scene] ?? SPOTS.idle;
    const from = currentX ?? spot.x;
    const dx = spot.x - from;
    if (Math.abs(dx) > 2) {
      setClip(video, CLIPS.walk);
      her.style.transition =
        'left 1.4s cubic-bezier(.45,.05,.35,1), bottom 1.4s cubic-bezier(.45,.05,.35,1), transform 1.4s cubic-bezier(.45,.05,.35,1)';
      const shadow = document.getElementById('herShadow');
      shadow.style.transition =
        'left 1.4s cubic-bezier(.45,.05,.35,1), bottom 1.4s cubic-bezier(.45,.05,.35,1), width 1.4s cubic-bezier(.45,.05,.35,1)';
      clearTimeout(walkTimer);
      walkTimer = setTimeout(() => {
        walkTimer = 0;
        setClip(video, CLIPS[lastScene] ?? CLIPS.idle);
      }, 1450);
    } else if (walkTimer === 0) {
      setClip(video, CLIPS[scene] ?? CLIPS.idle);
    }
    placeHer(her, spot, dx < 0);
  }

  // 调试：?scene=work 预览某一幕；?walk=work,eat 让她隔 3 秒走一圈；?emote=dance / sulk 预览反应
  const params = new URLSearchParams(location.search);
  const FORCED_SCENE = params.get('scene');
  const FORCED_EMOTE = params.get('emote');
  const WALK_DEMO = (params.get('walk') || '').split(',').filter(Boolean);
  const demoStart = Date.now();

  function paint(state) {
    const her = document.getElementById('her');
    const video = document.getElementById('herVideo');
    const now = Date.now();

    let scene = FORCED_SCENE || state.scene || 'idle';
    if (WALK_DEMO.length > 0) {
      scene = WALK_DEMO[Math.floor((Date.now() - demoStart) / 3000) % WALK_DEMO.length];
    }

    // 她刚被夸 / 被叫机器人账号：先反应一下，放完再回原场景
    const emote = FORCED_EMOTE
      ? { clip: FORCED_EMOTE, key: `forced:${FORCED_EMOTE}`, reason: '', until: Infinity }
      : state.emote && state.emote.until > now
        ? state.emote
        : null;

    if (!emote && emoteKey !== null) {
      emoteKey = null;
      clearTimeout(emoteTimer);
      emoteTimer = 0;
    }

    if (emote && emoteKey !== emote.key) {
      emoteKey = emote.key;
      lastScene = scene;
      clearTimeout(walkTimer);
      walkTimer = 0;
      her.dataset.scene = emote.clip;
      her.style.transition = 'left .45s ease, bottom .45s ease, transform .45s ease';
      document.getElementById('herShadow').style.transition = 'left .45s ease, bottom .45s ease, width .45s ease';
      placeHer(her, SPOTS[scene] ?? SPOTS.idle, false);
      setClip(video, CLIPS[emote.clip]);
      clearTimeout(emoteTimer);
      if (emote.until !== Infinity) {
        emoteTimer = setTimeout(() => {
          emoteKey = null;
          emoteTimer = 0;
          tick();
        }, Math.max(300, emote.until - Date.now()));
      }
    }

    const reacting = emoteKey !== null;
    if (!reacting) {
      lastScene = scene;
      her.dataset.scene = scene;
      walkTo(video, her, scene);
    }

    const at = bubbleAt(scene);
    const bubbleEl = document.getElementById('bubble');
    bubbleEl.style.left = at.left;
    bubbleEl.style.bottom = at.bottom;
    bubbleEl.textContent = reacting && !FORCED_EMOTE ? state.emote.reason : state.latest?.text ?? '';

    const doing = document.getElementById('doing');
    doing.innerHTML = `此刻：<b>${esc(state.activity)}</b>`;

    document.getElementById('since').textContent = state.activityMinutes
      ? `已经 ${fmtAgo(state.activityMinutes)}了`
      : '';

    document.getElementById('clock').textContent = state.clock;
    document.getElementById('mood').textContent = `心情：${state.mood}`;
    document.getElementById('energy').style.width = `${state.energy}%`;
    document.getElementById('energyText').textContent = state.energy;

    const m = state.meals;
    document.getElementById('meals').textContent = m.todayCount
      ? `${m.todayCount} 顿：${m.today.join(' / ')}`
      : '还没吃（账本空着）';

    const bowls = document.getElementById('bowls');
    bowls.innerHTML = '';
    const slots = ['早饭', '午饭', '晚饭', '宵夜'];
    for (const slot of slots) {
      const b = document.createElement('div');
      b.className = 'b' + (m.today.some((t) => t.startsWith(slot)) ? '' : ' empty');
      b.title = slot;
      bowls.appendChild(b);
    }

    const recent = document.getElementById('recent');
    recent.innerHTML = '<i>最近</i>';
    for (const item of (state.timeline ?? []).slice(-3)) {
      const t = new Date(item.at);
      const span = document.createElement('span');
      span.innerHTML = `<b>${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}</b>${esc(item.who)}：${esc(item.text)}`;
      recent.appendChild(span);
    }
  }

  let offline = false;
  async function tick() {
    try {
      const res = await fetch('/api/state', { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      paint(await res.json());
      if (offline) {
        offline = false;
        document.getElementById('doing').classList.remove('offline');
      }
    } catch (error) {
      offline = true;
      const doing = document.getElementById('doing');
      doing.classList.add('offline');
      doing.textContent = `连不上房间服务（${error.message}）`;
    }
  }

  tick();
  setInterval(tick, WALK_DEMO.length ? 800 : 3000);
</script>
</body>
</html>
